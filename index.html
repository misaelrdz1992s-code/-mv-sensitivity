
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>MV Sensitivity AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#090909;color:#fff;font-family:Arial,sans-serif}
.container{max-width:600px;margin:auto}
header{text-align:center;padding:20px;border-bottom:2px solid #ff3030}
h1{color:#ff3030}
.card{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin-top:18px}
label{display:block;margin:15px 0 7px}
input,select,button{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#242424;color:#fff;font-size:16px}
input[type=range]{accent-color:#ff3030}
button{background:#d92323;border:none;font-weight:bold;margin-top:15px;cursor:pointer}
.result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.stat{background:#242424;border-radius:10px;padding:14px;text-align:center}
.stat strong{display:block;color:#ff4040;font-size:24px;margin-top:8px}
#mensaje{line-height:1.5;color:#ddd}
</style>
</head>
<body>
<main class="container">
<header>
<h1>MV SENSITIVITY AI</h1>
<p>Generador de sensibilidad para Free Fire</p>
<small>BETA 2.1 · BLACK & RED</small>
</header>
<section class="card">
<h2>Configuración</h2>
<label for="telefono">Modelo de celular</label>
<input id="telefono" value="OPPO Reno 13 5G">
<label for="dpi">DPI actual</label>
<input id="dpi" type="number" min="200" max="1000" value="640">
<label for="dedos">Controles</label>
<select id="dedos">
<option value="2">2 dedos</option>
<option value="3">3 dedos</option>
<option value="4">4 dedos</option>
</select>
<label for="estilo">Estilo de sensibilidad</label>
<select id="estilo">
<option value="baja">Baja</option>
<option value="media">Media</option>
<option value="alta">Alta</option>
</select>
<button id="generar">GENERAR SENSIBILIDAD</button>
</section>
<section class="card">
<h2>Tu perfil</h2>
<div class="result" id="resultado"></div>
<button id="guardar">GUARDAR PERFIL</button>
<button id="cargar">RECUPERAR PERFIL</button>
</section>
<section class="card">
<h2>Prueba de puntería</h2>
<label for="problema">¿Qué sucede al apuntar?</label>
<select id="problema">
<option value="pecho">La mira se queda en el pecho</option>
<option value="bajo">Los disparos quedan por debajo</option>
<option value="alto">La mira sube demasiado</option>
<option value="alternado">Un tiro rojo y otro amarillo</option>
<option value="bien">Estoy acertando a la cabeza</option>
</select>
<button id="analizar">ANALIZAR PRUEBA</button>
<p id="mensaje">Registra una prueba para recibir un ajuste pequeño.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let perfil=null;
function generarPerfil(){
const dpi=Number($("dpi").value);
const telefono=$("telefono").value.trim();
const estilo=$("estilo").value;
if(!telefono||!Number.isFinite(dpi)||dpi<200||dpi>1000){
alert("Escribe el modelo del celular y un DPI entre 200 y 1000.");
return;
}
const base=estilo==="baja"?110:estilo==="media"?140:170;
const factor=Math.max(.85,Math.min(1.1,640/dpi));
perfil={
telefono,dpi,dedos:$("dedos").value,estilo,
"General":Math.round(base*factor),
"Punto rojo":Math.round((base-15)*factor),
"Mira 2x":Math.round((base-25)*factor),
"Mira 4x":Math.round((base-35)*factor),
"Francotirador":Math.round((base-65)*factor),
"Cámara libre":Math.round((base-20)*factor),
"Botón de disparo":48
};
for(const clave of ["General","Punto rojo","Mira 2x","Mira 4x","Francotirador","Cámara libre"]){
perfil[clave]=Math.max(0,Math.min(200,perfil[clave]));
}
mostrarPerfil();
}
function mostrarPerfil(){
if(!perfil)return;
$("resultado").replaceChildren();
for(const [nombre,valor] of Object.entries(perfil)){
if(["telefono","dpi","dedos","estilo"].includes(nombre))continue;
const tarjeta=document.createElement("div");
tarjeta.className="stat";
const etiqueta=document.createElement("span");
etiqueta.textContent=nombre;
const numero=document.createElement("strong");
numero.textContent=nombre==="Botón de disparo"?valor+"%":valor;
tarjeta.append(etiqueta,numero);
$("resultado").appendChild(tarjeta);
}
}
$("generar").addEventListener("click",generarPerfil);
$("guardar").addEventListener("click",()=>{
if(!perfil)return alert("Primero genera un perfil.");
try{
localStorage.setItem("mvSensitivityProfile",JSON.stringify(perfil));
alert("Perfil guardado.");
}catch{
alert("No se pudo guardar el perfil.");
}
});
$("cargar").addEventListener("click",()=>{
try{
const guardado=localStorage.getItem("mvSensitivityProfile");
if(!guardado)return alert("Todavía no hay un perfil guardado.");
perfil=JSON.parse(guardado);
$("telefono").value=perfil.telefono;
$("dpi").value=perfil.dpi;
$("dedos").value=perfil.dedos;
$("estilo").value=perfil.estilo;
mostrarPerfil();
}catch{
alert("No se pudo recuperar el perfil.");
}
});
$("analizar").addEventListener("click",()=>{
if(!perfil)return alert("Primero genera un perfil.");
const problema=$("problema").value;
let texto="";
if(problema==="pecho"||problema==="bajo"){
texto="Prueba aumentar General solo 2 puntos. Repite varias series y compara.";
}else if(problema==="alto"){
texto="Prueba reducir General solo 2 puntos. Repite varias series y compara.";
}else if(problema==="alternado"){
texto="Repite una serie de disparos. Si el fallo continúa, prueba cambiar General en 1 o 2 puntos.";
}else{
texto="Mantén el perfil actual y registra otra serie para confirmar el resultado.";
}
$("mensaje").textContent=texto;
});
generarPerfil();
</script>
</body>
</html>
